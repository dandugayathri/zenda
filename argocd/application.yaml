apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zenda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dandugayathri/zenda.git
    targetRevision: argo-deployment
    path: helm
    helm:
      releaseName: zenda
  destination:
    server: https://kubernetes.default.svc
    namespace: zenda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
