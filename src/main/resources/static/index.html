<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Zenda</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #17243a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(90%, 520px);
      padding: 3rem;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px rgba(23, 36, 58, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0 0 1.5rem; color: #526176; }
    a { color: #1459b8; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Zenda</h1>
    <p>The Zenda application is running.</p>
    <a href="/api/health">Check API health</a>
  </main>
</body>
</html>
