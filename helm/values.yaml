replicaCount: 1

image:
  repository: dandugayathri/zenda
  tag: sha-e926b00a5e48fc21ae74d69544a7952797884efd
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

startupProbe:
  path: /actuator/health/liveness
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  path: /actuator/health/liveness
  periodSeconds: 10

readinessProbe:
  path: /actuator/health/readiness
  periodSeconds: 5
