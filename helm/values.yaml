replicaCount: 1
autoscaling:
  enabled: false


image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""
  #PullSecrets: ""
labels: {}

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  host: 

service:
  type: ClusterIP
  port: 80
  targetport: 8080

vault:
  enabled: false
  secret: 

resources: 
 limits:
   memory: 1Gi
 requests:
   memory: 1Gi

startupProbe:
  enabled: true
  path: /v1/api/actuator/health/liveness
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 4
  port: 8080
livenessProbe:
  enabled: true
  path: /v1/api/actuator/health/liveness
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 4
  port: 8080
readinessProbe:
  enabled: true
  path: /v1/api/actuator/health/readiness
  initialDelaySeconds: 60 
  periodSeconds: 20
  timeoutSeconds: 10 
  successThreshold: 1
  failureThreshold: 4
  port: 8080
nodeSelector: {}

tolerations: []

affinity: {}
